[package]
name = "stardew-steward"
version = "0.1.0"
edition = "2024"

[dependencies]
# 存档解析
roxmltree = "0.20"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Agent 核心
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }

# 知识库
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = "0.28"

# 文件监听
notify = "7"

# 并行
rayon = "1"

# 配置与日志
toml = "0.8"
dotenvy = "0.15"
anyhow = "1"
