[package]
name = "stardew-steward-gui"
version = "0.1.0"
edition = "2024"

[dependencies]
stardew-steward = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
once_cell = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
